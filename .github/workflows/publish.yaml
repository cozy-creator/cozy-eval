name: Publish to PyPI

# Publication IS the tag push (the gen-worker pattern, docs/releasing.md there).
# No local `uv publish` — this workflow is the single release procedure.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    # Hang bound, not a work budget.
    timeout-minutes: 20
    permissions:
      contents: read   # checkout on a private/org repo
      id-token: write  # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      # --locked: fail loudly if uv.lock drifts from pyproject.toml instead of
      # silently resolving versions the tests never saw. All extras: the metric
      # tests import scipy/torch/etc. for real, no graceful skip.
      - name: Install dependencies
        run: uv sync --locked --all-extras

      # cozy-eval has no separate CI yet, so the publish gate runs the suite
      # itself, bounded by the job timeout. When a ci.yml exists, switch to the
      # gen-worker assert-provenance pattern instead of re-running tests here.
      - name: Tests
        run: uv run pytest tests/ -x -q

      - name: Version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(uv run python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$TAG" != "$VER" ]; then
            echo "tag v$TAG != pyproject version $VER"; exit 1
          fi

      - name: Build
        run: uv build

      - name: Publish (trusted publishing)
        run: uv publish
