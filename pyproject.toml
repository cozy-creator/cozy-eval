[project]
name = "cozy-eval"
version = "0.2.0"
description = "Quality benchmarking for generative image and video models, with the validity rules enforced by the API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["video-quality", "image-quality", "audio-quality", "av-sync", "quantization", "diffusion", "benchmark", "no-reference", "text-to-image", "image-editing", "vlm-judge"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=1.26", "msgspec>=0.19"]

[project.optional-dependencies]
reference = [
  "ffmpeg-quality-metrics>=3.12",
  "cvvdp>=0.5.6",
  "scikit-image>=0.22",
  "lpips>=0.1.4",
  "torch>=2.4",
]
distributional = ["scipy>=1.11", "cd-fvd>=0.1.1"]
similarity = ["torch>=2.4", "torchmetrics[image]>=1.9", "numpy>=1.26"]
# transformers 4.57 floor: the default judge is Qwen3-VL, whose classes land in 4.57.
# Covers every model-scored adherence path: VLM judge, CLIP fallback, and the
# Grounding DINO + SigLIP2 detectors behind compositional scoring.
judge = ["torch>=2.4", "transformers>=4.57", "numpy>=1.26", "pillow>=10"]
# rapidocr 3.0 floor: the unified entry point only exists from 3.0
ocr = ["rapidocr>=3.0", "onnxruntime>=1.18"]
preference = ["torch>=2.4", "transformers>=4.57"]
# piq floor: torchmetrics' default clip_iqa checkpoint is loaded through piq at runtime
quality = ["torch>=2.4", "torchmetrics[image]>=1.9", "piq>=0.8", "numpy>=1.26", "scipy>=1.11", "pillow>=10"]
hpsv3 = ["torch>=2.4", "transformers>=4.53", "safetensors>=0.4", "huggingface-hub>=0.23", "pillow>=10"]
# opencv (headless) is the backend for BOTH motion families: optical flow
# (flow_divergence / warp_error) and the Lucas-Kanade tracker behind track
# stability, which deliberately adds no dependency of its own — the permissive
# learned trackers cost a checkpoint download and the obvious one (CoTracker) is
# CC-BY-NC-4.0. VMAF additionally needs an ffmpeg built with --enable-libvmaf on
# PATH (or VMAF_FFMPEG) — a system binary, not a pip dep.
video = ["numpy>=1.26", "pillow>=10", "opencv-python-headless>=4.9"]
# scipy is only for the BS.1770-4 K-weighting IIR; everything else in the audio
# tier is numpy. DELIBERATELY NOT torchmetrics[audio]: that extra pulls `pesq`,
# which ships modified ITU-T P.862 reference C whose rights holders (Psytechnics,
# OPTICOM) forbid modification and restrict use to non-commercial conformance
# testing. Its MIT label is the packager's and does not override that notice.
audio = ["numpy>=1.26", "scipy>=1.11"]
# fine-detail fidelity: numpy+scipy for the ringing diagnostic, torchmetrics[image]
# for the paired DISTS texture distance, rapidocr for the text-legibility pre-screen,
# and the judge extra for the VLM rubric (the primary catch).
detail = ["numpy>=1.26", "scipy>=1.11", "torchmetrics[image]>=1.9", "pillow>=10",
          "cozy-eval[ocr,judge]"]

all = ["cozy-eval[reference,distributional,similarity,judge,ocr,preference,quality,hpsv3,video,audio,detail]"]
dev = ["pytest>=8.0", "ruff>=0.6", "pillow>=10"]

[project.urls]
Homepage = "https://github.com/cozy-creator/cozy-eval"
Source = "https://github.com/cozy-creator/cozy-eval"
Issues = "https://github.com/cozy-creator/cozy-eval/issues"

[project.scripts]
cozy-eval = "cozy_eval.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cozy_eval"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "heavy: downloads real model weights; deselected by default",
  "corpus: needs the banked fal MiniMax-H3 sample corpus on disk; skipped when absent",
]
addopts = ["-m", "not heavy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PLW", "ISC"]
ignore = ["E501"]
